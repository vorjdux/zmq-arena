# Standalone project. NOT a member of the orchestrator workspace.
# Build: `cd targets/rzmq_target && cargo build --release` (Linux for io-uring).
#
# Engine: rzmq (excsn/rzmq), pure-Rust ZeroMQ with io_uring + TCP_CORK on Linux.
[workspace]

[package]
name = "rzmq-target"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "zmq-arena target wrapper: rzmq (io_uring + TCP_CORK)."

[[bin]]
name = "rzmq-target"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
# Verified on crates.io: latest 0.5.21, edition 2024, MPL-2.0.
# Verified on crates.io: rzmq 0.5.25 is the latest release.
rzmq = { version = "0.5.25", features = ["io-uring", "curve"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Strict lints, matching the control plane's policy in the root Cargo.toml. A
# target is measured code: a subtle mistake here shows up as a benchmark number
# rather than a crash, so it gets the same scrutiny as the harness. The allows
# are the same justified set (numeric conversions between counters, byte sizes
# and f64; benchmark vocabulary that is genuinely repetitive).
[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
similar_names = "allow"
