# Standalone project. NOT a member of the orchestrator workspace.
# Build: `cd targets/celerity_target && cargo build --release`.
#
# Engine: celerity (ShemShadrack/celerity), pure-Rust ZMTP 3.1 sans-IO core
# (CelerityPeer) with a Tokio transport layer for TCP and Unix-domain IPC.
[workspace]

[package]
name = "celerity-target"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "zmq-arena target wrapper: celerity (sans-IO ZMTP 3.1 + Tokio)."

[[bin]]
name = "celerity-target"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
# Verified on crates.io: celerity 0.2.0 (MIT).
# Verified on crates.io: celerity 0.1.1 is the latest release. This previously
# pinned 0.2.0, which has never existed, so the target could not resolve at all
# and `cargo build` failed before reaching the unimplemented socket loops.
celerity = { version = "0.1.1", features = ["tokio", "ipc", "curve"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Strict lints, matching the control plane's policy in the root Cargo.toml. A
# target is measured code: a subtle mistake here shows up as a benchmark number
# rather than a crash, so it gets the same scrutiny as the harness. The allows
# are the same justified set (numeric conversions between counters, byte sizes
# and f64; benchmark vocabulary that is genuinely repetitive).
[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
similar_names = "allow"
