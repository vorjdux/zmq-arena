<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>zmq-arena · features</title>
<style>
  :root {
    --bg:#0f1216; --panel:#171b21; --panel2:#1d2229; --line:#2a313a;
    --fg:#e6e9ee; --muted:#9aa4b2; --accent:#4f9cf9; --warn:#f59e0b;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f6f7f9; --panel:#fff; --panel2:#f0f2f5; --line:#e2e6eb;
            --fg:#161a1e; --muted:#5b6573; --accent:#2563eb; --warn:#b45309; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
    font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  header { padding:18px 24px 6px; display:flex; align-items:center;
    justify-content:space-between; gap:8px 24px; flex-wrap:wrap; }
  h1.logo { margin:0; line-height:0; flex:0 0 auto; }
  h1.logo img { height:104px; width:auto; max-width:100%; display:block; }
  /* Column picker. Thirteen implementations side by side is a lot to read when
     the question is usually about two or three of them, so the table narrows to
     whatever is selected. Grouped by language, because that is how the choice is
     usually framed ("the Rust ones", "what can I use from Python"). */
  /* Same 24px gutter as .intro and main, so the bar lines up with the table it
     filters instead of starting at the window edge. */
  .picker { padding:16px 24px 2px; display:flex; flex-wrap:wrap; gap:8px 10px;
    align-items:center; }
  .picker .grp { display:flex; gap:5px; align-items:center; padding:3px 8px 3px 6px;
    border:1px solid var(--line); border-radius:999px; }
  .picker .glab { font-size:10px; text-transform:uppercase; letter-spacing:.6px;
    color:var(--muted); padding-right:3px; }
  .picker .pchip { cursor:pointer; user-select:none; font-size:12px; padding:3px 9px;
    border-radius:999px; border:1px solid var(--line); background:var(--panel);
    color:var(--muted); }
  .picker .pchip.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  .picker .pact { cursor:pointer; font-size:11px; color:var(--accent); background:none;
    border:none; padding:3px 5px; }
  /* Kept in the flow next to the buttons it belongs with. Pushed to the far edge
     with margin-left:auto it stranded itself a screen-width away from them, and
     clipped once the row filled. */
  .picker .pcount { font-size:11px; color:var(--muted); padding-left:2px; }
  @media (max-width:640px){ .picker{ padding:12px 8px 2px; } }

  /* The stable+draft breakdown next to a socket-type total. */
  .dft { color:var(--muted); font-size:11px; font-variant-numeric:tabular-nums; }
  .sub { color:var(--muted); flex:1 1 300px; text-align:right; min-width:0; }
  .sub code { color:var(--fg); }
  .topnav { display:flex; gap:2px; padding:0 24px; border-bottom:1px solid var(--line); }
  .topnav a { padding:9px 15px; color:var(--muted); text-decoration:none;
    border-bottom:2px solid transparent; font-size:14px; }
  .topnav a:hover { color:var(--fg); }
  .topnav a.active { color:var(--fg); border-bottom-color:var(--accent); font-weight:600; }
  @media (max-width:640px){ .topnav{ padding:0 8px; } }
  .sub a { color:var(--accent); }
  .controls { position:sticky; top:0; z-index:5; display:flex; flex-wrap:wrap;
    align-items:flex-end; gap:13px 16px; padding:13px 24px; margin-top:12px;
    background:color-mix(in srgb,var(--bg) 90%,transparent);
    backdrop-filter:blur(6px); border-bottom:1px solid var(--line); }
  .ctl { display:flex; flex-direction:column; gap:4px; }
  .ctl label { font-size:11px; text-transform:uppercase; letter-spacing:.6px; color:var(--muted); }
  select { background:var(--panel); color:var(--fg); border:1px solid var(--line);
    border-radius:7px; padding:7px 9px; font-size:13px; min-width:150px; }
  .banner { margin:12px 24px 0; padding:8px 12px; border-radius:8px;
    background:color-mix(in srgb,var(--warn) 18%,transparent);
    border:1px solid var(--warn); font-size:13px; }
  .banner.hidden { display:none; }
  .intro { padding:12px 24px 0; color:var(--muted); font-size:13px; max-width:1000px; }
  .intro b { color:var(--fg); }
  main { padding:14px 24px 28px; display:grid; gap:16px;
    grid-template-columns:repeat(auto-fill, minmax(340px, 1fr)); }
  /* A table wider than the page must scroll inside its own box. `main` is a
     grid, and a grid item defaults to min-width:auto, which means "as wide as my
     content": the card grew to fit the widest table and took the whole page
     sideways with it, so the header, the controls and every other table scrolled
     away too. min-width:0 lets the item shrink, which is what makes the wrapper
     below actually scroll. */
  main > * { min-width:0; }
  .tw { overflow-x:auto; max-width:100%; }
  /* Freeze the identifying column. Scrolled far enough right, every row became
     an anonymous line of numbers; keeping the first cell pinned means a value is
     always attached to the thing it describes. It needs an opaque background of
     its own, or the cells passing underneath show through. */
  .tw th:first-child, .tw td:first-child {
    position:sticky; left:0; z-index:1; background:var(--panel);
    box-shadow:1px 0 0 var(--line); }
  .tw thead th:first-child { z-index:2; }

  .board { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px 14px; }
  .board h2 { margin:0 0 2px; font-size:14px; }
  .board .note { color:var(--muted); font-size:12px; margin-bottom:8px; }
  table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; }
  th,td { text-align:right; padding:5px 8px; border-bottom:1px solid var(--line); }
  th:nth-child(2),td:nth-child(2) { text-align:left; }
  th { color:var(--muted); font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:.4px; }
  td small { color:var(--muted); }
  .sw { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:6px; vertical-align:middle; }
  .lead td { font-weight:700; color:var(--accent); }
  .partial { color:var(--warn); cursor:help; }
  .cap-yes { color:#34d399; font-weight:600; }
  .cap-declared { color:var(--warn); }
  .cap-no { color:var(--muted); }
  .cap-partial { color:var(--accent); }
  /* The matrix is one wide table, not a card: it must span every column of the
     grid main lays out, and scroll inside itself rather than stretching the page. */
  /* `main` is a grid, and a grid item defaults to min-width:auto -- "as wide as
     my content" -- so the wrapper stretched to fit the table instead of
     scrolling it, and thirteen columns were squeezed until every cell wrapped
     over four lines. min-width:0 lets it shrink, which is what makes the
     overflow below actually scroll. */
  main > * { min-width:0; }
  .wrap { grid-column:1 / -1; overflow-x:auto; max-width:100%; margin-bottom:6px; }
  .wrap th:first-child, .wrap td:first-child {
    position:sticky; left:0; z-index:1; background:var(--panel);
    box-shadow:1px 0 0 var(--line); }
  .wrap thead th:first-child { z-index:2; }
  /* One fixed width for every library column, and text wraps inside it.
     Sizing columns to their content instead made the table ragged: the
     transports row stretched omq's column to fit "tcp, ipc, inproc, udp, ws,
     wss, lz4+tcp, zstd+tcp" on one line while its neighbours stayed narrow, so
     comparing a row across libraries meant tracking cells of wildly different
     widths. A uniform grid reads down a row instead. */
  .wrap table { table-layout:fixed; width:max-content; }
  .wrap th, .wrap td { width:186px; white-space:normal; overflow-wrap:break-word;
    vertical-align:top; }
  .wrap th:first-child, .wrap td:first-child { width:210px; }
  /* Vertical rules between the library columns. With uniform widths and cells
     that wrap over several lines, a row of values is easy to lose track of:
     "declared" under omq and "declared" under monocoque are the same words in
     the same place, and only the column tells them apart. */
  .wrap th, .wrap td { border-right:1px solid var(--line); }
  .wrap th:last-child, .wrap td:last-child { border-right:0; }
  .wrap tbody td:first-child { color:var(--muted); white-space:nowrap; }
  /* The details cell: a disclosure per library, in that library's column. */
  .detailrow td { padding-top:8px; }
  .more > summary { list-style:none; cursor:pointer; font-size:12px;
    color:var(--accent); white-space:nowrap; }
  .more > summary::-webkit-details-marker { display:none; }
  .more > summary::after { content:" ▾"; opacity:.6; }
  .more[open] > summary::after { content:" ▴"; }
  .more-body { margin-top:6px; text-align:left; font-size:12px; }
  .more-body h4 { margin:0 0 5px; font-size:12px; color:var(--fg); }
  .drow { margin:0 0 5px; }
  .drow b { display:block; font-size:9.5px; text-transform:uppercase;
    letter-spacing:.6px; color:var(--muted); font-weight:600; }
  .drow span { color:var(--muted); }
  .hint { color:var(--muted); font-size:13px; }
  .err { padding:24px; color:var(--warn); }
  footer { color:var(--muted); font-size:12px; text-align:center;
    padding:18px 24px 22px; background:var(--panel2); border-top:1px solid var(--line); }
  footer div { max-width:900px; margin:0 auto; }
  footer a { color:var(--accent); }
  @media (max-width:640px){
    header,.controls,footer,.intro{ padding-left:14px; padding-right:14px; }
    main{ padding:10px 14px 24px; grid-template-columns:1fr; }
    .banner{ margin-left:14px; margin-right:14px; }
    header{ justify-content:center; }
    h1.logo{ flex:1 1 100%; }
    h1.logo img{ width:100%; height:auto; }
    .sub{ flex-basis:100%; text-align:center; }
    select{ min-width:0; width:100%; }
    .ctl{ flex:1 1 150px; }
  }
</style>
</head>
<body>
<header>
  <h1 class="logo"><img src="zmq-arena-logo.svg" alt="zmq-arena: ZMTP benchmark battleground"></h1>
  <div class="sub" id="dataSource">loading...</div>
</header>
<nav class="topnav"><a href="index.html">Overview</a><a href="rankings.html">Rankings</a><a href="explore.html">Explore</a><a href="tables.html">Tables</a><a href="features.html" class="active">Features</a></nav>
<div class="banner hidden" id="sampleBanner"></div>

<div class="intro" id="intro"></div>
<div class="picker" id="picker" hidden></div>
<main id="main" hidden></main>
<div class="err" id="err" hidden></div>
<footer id="footer"></footer>

<script>
"use strict";

// The feature matrix is the one page here that does not come from a run. It
// reads the curated features.json, and it is emphatic about which cells are
// verified and which are a project's own claim, because a capability table that
// looks measured but is hand-written is worse than none.

const el = id => document.getElementById(id);
const CAP_CLASS = { yes:"cap-yes", declared:"cap-declared", no:"cap-no", partial:"cap-partial" };
const esc = s => String(s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

function cap(v){
  const cls = CAP_CLASS[v] || "";
  return `<span class="${cls}">${esc(v)}</span>`;
}

// Stable and draft counted separately. A single number made the libraries that
// implement the draft types look narrower than libzmq when they are wider, since
// only the stable set was ever counted. The draft half is dimmed because those
// types are not yet stable in the RFC, not because they are less implemented.
function socketCount(i){
  const first = String(i.socket_types[0] || "");
  if(first.startsWith("declared")) return cap("declared");
  const st = i.socket_types.length, dr = (i.socket_types_draft || []).length;
  return dr ? `${st + dr} <span class="dft" title="${st} stable + ${dr} draft">${st}+${dr}</span>`
            : `${st}`;
}

const ROWS = [
  ["version",                          i => esc(i.version)],
  ["language",                         i => esc(i.language)],
  // Name the engine a binding calls into rather than assuming libzmq: pyomq
  // binds the omq Rust core, and "FFI to libzmq" would claim the two Python
  // rows share an engine when the pair exists to show that they do not.
  ["implementation",                   i => i.impl === "native"
                                            ? "native"
                                            : `FFI to ${esc(i.binds || "?")}`],
  ["socket types",                     socketCount],
  ["transports",                       i => i.transports.map(esc).join(", ")],
  ["NULL",                             i => cap(i.security.null)],
  ["PLAIN",                            i => cap(i.security.plain)],
  ["CURVE",                            i => cap(i.security.curve)],
  ["usable without an async runtime",  i => cap(i.runtime_free)],
  ["platforms",                        i => i.platforms.map(esc).join(", ")],
  ["bindings",                         i => esc(i.bindings)],
  ["benchmarked here",                 i => esc(i.arena_tier)],
];

// Everything that does not fit a row of its own: the full socket list, the
// runtime note, the caveats and the source it was read from.
//
// This used to be thirteen cards stacked under the table, which meant scrolling
// away from the matrix and then finding the right one by name. As the last row
// of the grid it stays in the column it belongs to, so the detail for monocoque
// is directly under monocoque.
function details(i){
  const rows = [
    ["Socket types", i.socket_types.join(", ")],
    (i.socket_types_draft || []).length
      ? ["Draft socket types", i.socket_types_draft.join(", ")] : null,
    ["Runtime", i.runtime_note],
    i.notes ? ["Notes", i.notes] : null,
    ["Source", i.source],
  ].filter(Boolean);
  const body = rows.map(([k, v]) =>
    `<div class="drow"><b>${esc(k)}</b><span>${esc(v)}</span></div>`).join("");
  return `<details class="more"><summary>More details</summary>` +
    `<div class="more-body"><h4>${esc(i.label)} ${esc(i.version)}</h4>${body}</div></details>`;
}

function matrix(impls){
  let h = `<div class="wrap"><table><thead><tr><th>capability</th>` +
    impls.map(i => `<th>${esc(i.label)}</th>`).join("") + `</tr></thead><tbody>`;
  for (const [label, fn] of ROWS){
    h += `<tr><td>${esc(label)}</td>` + impls.map(i => `<td>${fn(i)}</td>`).join("") + `</tr>`;
  }
  h += `<tr class="detailrow"><td>details</td>` +
    impls.map(i => `<td>${details(i)}</td>`).join("") + `</tr>`;
  return h + `</tbody></table></div>`;
}

// Which columns are on. Stored as the set of HIDDEN ids, so a selection made
// today still means the same thing after the arena gains an implementation:
// storing the visible list would silently hide every new one.
const PKEY = "zmq-arena.features.hidden.v1";
let hidden = new Set();
let ALL = [];

function loadHidden(){
  try { const r = JSON.parse(localStorage.getItem(PKEY)); if(Array.isArray(r)) return new Set(r); }
  catch(e){ /* unavailable or corrupt storage: show everything */ }
  return new Set();
}
function saveHidden(){
  try { localStorage.setItem(PKEY, JSON.stringify([...hidden])); } catch(e){ /* private mode */ }
}
const shown = () => ALL.filter(i => !hidden.has(i.id));

function renderPicker(){
  const byLang = new Map();
  for(const i of ALL){
    if(!byLang.has(i.language)) byLang.set(i.language, []);
    byLang.get(i.language).push(i);
  }
  let h = "";
  for(const [lang, list] of byLang){
    h += `<span class="grp"><span class="glab">${esc(lang)}</span>` +
      list.map(i => `<span class="pchip${hidden.has(i.id) ? "" : " on"}" data-id="${esc(i.id)}">` +
        `${esc(i.label)}</span>`).join("") + `</span>`;
  }
  h += `<button class="pact" data-act="all">all</button>` +
       `<button class="pact" data-act="none">none</button>` +
       `<span class="pcount">${shown().length} of ${ALL.length} shown</span>`;
  const box = el("picker");
  box.innerHTML = h;
  box.hidden = false;
  box.querySelectorAll(".pchip").forEach(c => c.addEventListener("click", () => {
    const id = c.dataset.id;
    if(hidden.has(id)) hidden.delete(id); else hidden.add(id);
    // Never leave the table with no columns: the last one stays on.
    if(!shown().length) hidden.delete(id);
    saveHidden(); renderPicker(); renderMatrix();
  }));
  box.querySelectorAll(".pact").forEach(b => b.addEventListener("click", () => {
    hidden = b.dataset.act === "all" ? new Set() : new Set(ALL.slice(1).map(i => i.id));
    saveHidden(); renderPicker(); renderMatrix();
  }));
}

function renderMatrix(){
  el("main").innerHTML = matrix(shown());
  el("main").hidden = false;
}

async function load(){
  const r = await fetch("features.json?_=" + Date.now(), {cache:"no-store"});
  if(!r.ok) throw new Error("features.json -> " + r.status);
  const data = await r.json();
  const impls = data.implementations;

  el("dataSource").innerHTML = `${impls.length} implementations - curated, ` +
    `read on <code>${esc(data.verified_on)}</code>`;
  el("intro").innerHTML =
    `What each implementation supports, next to what it measures. A fast library that ` +
    `lacks the socket type you need, or whose CURVE does not interoperate, is not a ` +
    `candidate wherever it lands on a chart. <b>This page is curated, not measured:</b> ` +
    `<span class="cap-yes">yes</span> means the project documents it and zmq-arena ` +
    `exercises it, <span class="cap-declared">declared</span> means we are repeating the ` +
    `project's claim and have not tested it. Edit <code>features.json</code> and run ` +
    `<code>scripts/render_features.py</code> to change it.`;

  ALL = impls;
  hidden = loadHidden();
  // An id that vanished from the data should not keep filtering.
  for(const id of [...hidden]) if(!ALL.some(i => i.id === id)) hidden.delete(id);
  if(!shown().length) hidden.clear();
  renderPicker();
  renderMatrix();
}

el("footer").innerHTML =
  `<div>zmq-arena - feature matrix - curated from each project's documentation, ` +
  `not from a run - <a href="index.html">overview</a></div>` +
  `<div style="margin-top:6px">(c) ${new Date().getFullYear()} Matheus Santos - ` +
  `<a href="https://github.com/vorjdux/zmq-arena">github.com/vorjdux/zmq-arena</a></div>`;

load().catch(e => {
  el("dataSource").textContent = "failed to load features.json";
  const err = el("err"); err.hidden = false;
  err.textContent = "Could not load features.json: " + e.message +
    ". Serve this folder over HTTP (browsers block file:// fetches).";
});
</script>
</body>
</html>
