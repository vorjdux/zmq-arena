# Chart generation for the control plane.
#
# A workspace member rather than a standalone project: unlike a target, this
# measures nothing, so sharing the orchestrator's dependency graph and toolchain
# cannot bias a comparison. It reads a rendered run archive (the same JSON the
# dashboard loads) and writes static SVGs.
#
# The interactive dashboard under docs/ still exists and still owns history
# drill-down. These charts are the other half: a fixed, linkable picture for the
# README and for anyone reading the repo rather than browsing a site.
[package]
name = "zmq-arena-reporter"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Static SVG chart generation for zmq-arena run archives."

[[bin]]
name = "zmq-arena-report"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
# SVG only. The default feature set pulls font rasterization and bitmap backends,
# which a static SVG writer does not need: text is emitted as <text> and the
# viewer resolves the family. Same configuration omq-bench uses.
plotters = { version = "0.3", default-features = false, features = ["svg_backend", "line_series"] }

[lints]
workspace = true
