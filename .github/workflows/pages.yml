# Publish docs/ to GitHub Pages.
#
# Place at .github/workflows/pages.yml to activate, and set
# Settings > Pages > Source to "GitHub Actions".
#
# This deploys the dashboard, the static charts, and the feature matrix. It does
# NOT run any benchmark: it runs on a GitHub-hosted runner and only assembles
# and uploads the site, so it is safe to trigger any time. Measurement happens in
# weekly-arena.yml on the bare-metal runner, which deploys the site itself once
# it has fresh results.
#
# Run archives are committed under docs/history/, so a deploy is just an upload
# of what the repository already contains. Nothing is fetched or reconstructed:
# what you can see in git is what the site will serve. Until the first run is
# committed the dashboard falls back to the synthetic sample data and says so.

name: pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "features.json"
      - "scripts/render_features.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Shared with weekly-arena.yml so a scheduled run and a docs push cannot deploy
# on top of each other. Queue rather than cancel: a cancelled deploy would leave
# the site on whichever revision happened to win.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Publish the variant registry
        # The dashboard pages fetch variants.json for their labels and colours,
        # and this also fails the build if the matrix grew a variant that has no
        # presentation entry.
        run: python3 scripts/render_variants.py

      - name: Refresh the feature matrix
        # Curated data, but regenerating guarantees docs/features.json matches
        # features.json even if someone edited only the source.
        run: python3 scripts/render_features.py

      - uses: actions/configure-pages@v6
        id: pages
        with:
          # Create the Pages site (build_type: workflow) if the repository does
          # not have one yet, instead of failing with "Get Pages site failed".
          # Without this the very first deploy needs someone to click through
          # Settings > Pages by hand, which is a poor bootstrap for a workflow
          # whose whole job is to publish. Idempotent once the site exists.
          enablement: true

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - uses: actions/deploy-pages@v5
        id: deployment
