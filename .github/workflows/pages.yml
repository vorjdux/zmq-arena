# Publish docs/ to GitHub Pages.
#
# Place at .github/workflows/pages.yml to activate, and set
# Settings > Pages > Source to "GitHub Actions".
#
# This deploys the dashboard, the static charts, and the feature matrix. It does
# NOT run any benchmark: it runs on a GitHub-hosted runner and only assembles
# and uploads the site, so it is safe to trigger any time. Measurement happens in
# weekly-arena.yml on the bare-metal runner, which deploys the site itself once
# it has fresh results.
#
# Run archives are deliberately not in git (docs/history/* is gitignored, so
# dev-host runs never churn the repo). The site itself is therefore the store:
# sync_history.py downloads what is already published and puts it back before the
# upload, so a deploy from a clean checkout does not wipe the run history the
# Explore page plots over. First deploy just starts empty and the dashboard falls
# back to the synthetic sample data.

name: pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "features.json"
      - "scripts/render_features.py"
      - "scripts/sync_history.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Shared with weekly-arena.yml so a scheduled run and a docs push cannot deploy
# on top of each other. Queue rather than cancel: a cancelled deploy would leave
# the site on whichever revision happened to win.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Refresh the feature matrix
        # Curated data, but regenerating guarantees docs/features.json matches
        # features.json even if someone edited only the source.
        run: python3 scripts/render_features.py

      - name: Restore the published run history
        # ${{ steps.pages.outputs.base_url }} is not available before configure,
        # so derive the site root from the repository coordinates instead.
        run: |
          BASE="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
          echo "restoring from $BASE"
          python3 scripts/sync_history.py --base-url "$BASE" --keep 26

      - uses: actions/configure-pages@v5
        id: pages

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - uses: actions/deploy-pages@v4
        id: deployment
