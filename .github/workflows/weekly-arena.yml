# Weekly grid run.
#
# THE SCHEDULE IS DELIBERATELY COMMENTED OUT. This job only runs on a
# self-hosted runner labelled [self-hosted, bare-metal, perf-locked]. Until such
# a runner is registered, a live cron would queue a job every Monday that no
# runner can pick up, so it would sit pending and then fail, once a week,
# forever. Uncomment the `schedule:` block below the moment the runner exists.
# `workflow_dispatch` stays enabled so the grid can still be triggered by hand.
#
# Execution environment requirements (enforced on the runner, not here):
#   - Bare-metal instance (e.g. AWS *.metal) or dedicated bare-metal CI runner.
#   - Intel Turbo Boost / AMD CPB disabled.
#   - C-states locked (e.g. intel_idle.max_cstate=1 / processor.max_cstate=1).
#   - cpufreq governor = performance.
# These remove frequency-scaling artifacts from the p99/p99.9 distribution. A
# shared cloud runner will not produce admissible tail numbers; the job asserts
# the runner label before measuring.

name: weekly-arena

on:
  # schedule:
  #   # 04:00 UTC every Monday. Once per week, deterministic slot.
  #   - cron: "0 4 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write  # commit the feature matrix and the variant registry
  pages: write     # deploy the refreshed dashboard
  id-token: write  # required by actions/deploy-pages

concurrency:
  group: weekly-arena
  cancel-in-progress: false

jobs:
  grid:
    # Self-hosted bare-metal runner with these labels. Do not fall back to
    # GitHub-hosted runners: shared vCPUs invalidate the tail latency.
    runs-on: [self-hosted, bare-metal, perf-locked]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7

      - name: Assert performance-locked host
        run: |
          set -euo pipefail
          # Fail fast if turbo / C-states are not locked. Adjust paths per host.
          gov=$(cat /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor || echo "unknown")
          echo "governor=$gov"
          test "$gov" = "performance" || { echo "governor must be 'performance'"; exit 1; }

      - name: Build control plane + every target (each in its own invocation)
        # build-targets.sh builds the control plane and each standalone target
        # separately so per-target lockfiles and toolchain pins are honored. No
        # --workspace build of the targets, by design.
        run: ./scripts/build-targets.sh

      - name: Regenerate the matrix
        # The committed matrix is generated, so regenerate rather than trusting
        # the checked-in copy to be current with scripts/gen_matrix.py.
        run: python3 scripts/gen_matrix.py

      - name: Run the matrix
        run: |
          RUN_ID=$(date -u +%F)
          ./target/release/zmq-arena run \
            --matrix matrix.linode.json \
            --run-id "$RUN_ID" \
            --out "scratch/$RUN_ID"
          echo "RUN_ID=$RUN_ID" >> "$GITHUB_ENV"

      - name: Generate ledger + dashboard archive
        run: |
          # Reads scratch/$RUN_ID/*.json (orchestrator CellRecords) and writes
          # docs/history/$RUN_ID-run.json and docs/history/index.json.
          python3 scripts/render_results.py \
            --scratch "scratch/$RUN_ID" \
            --run-id "$RUN_ID" \
            --hardware-cpu "$(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2 | sed 's/^ *//')" \
            --hardware-note "turbo off, C-states locked, performance governor"

      - name: Publish the variant registry
        run: python3 scripts/render_variants.py

      - name: Refresh the feature matrix
        # Curated data, but regenerating keeps FEATURES.md and docs/features.json
        # in step with features.json if someone edited only the source.
        run: python3 scripts/render_features.py

      - name: Commit the repo-facing results
        # The run archive is committed alongside the curated registries. It is
        # the canonical result, and committing it is what lets the deploy below
        # be a plain upload of the repository rather than a reconstruction of
        # history from whatever happens to be live. About 300 KB per run.
        run: |
          git config user.name "arena-bot"
          git config user.email "arena-bot@users.noreply.github.com"
          git add FEATURES.md docs/features.json docs/variants.json \
            "docs/history/${RUN_ID}-run.json" docs/history/index.json
          git commit -m "weekly grid: ${RUN_ID}" || echo "nothing to commit"
          git push || echo "push skipped"

      - name: Keep the raw telemetry
        # The archive itself is in git; this keeps the scratch directory it was
        # rendered from, so a run can be re-rendered if the record schema
        # changes.
        uses: actions/upload-artifact@v7
        with:
          name: run-archive-${{ env.RUN_ID }}
          path: |
            docs/history/${{ env.RUN_ID }}-run.json
            scratch/${{ env.RUN_ID }}
          retention-days: 90

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  # Deploying is split out so the measuring job does not hold the Pages
  # concurrency lock for its whole multi-hour run, which would block every docs
  # push in the meantime. This job is seconds long and shares the lock with
  # pages.yml, so the two can never deploy on top of each other.
  publish:
    needs: grid
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Provision the Pages site if it does not exist yet, for the same reason
      # pages.yml does: deploy-pages fails outright against a repository with no
      # Pages site, and a grid run that measured for hours should not be lost to
      # a missing repository setting. Idempotent once the site exists.
      - uses: actions/configure-pages@v6
        with:
          enablement: true

      - uses: actions/deploy-pages@v5
        id: deployment
